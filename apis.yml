  name: Dwolla Events API
  description: >-
    List and retrieve Events — the immutable record of every state change across your Dwolla application
    (customer verified, transfer created/completed/failed, funding source added, and more). Events are
    retained for 30 days and are the source that backs webhook notifications, letting you reconcile or
    replay activity via polling.

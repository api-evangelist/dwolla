- aid: dwolla:dwolla-accounts-api
  name: Dwolla Accounts API
  description: >-
    Retrieve details about your master Dwolla Account and manage account-level resources including creating
    and listing the account's own funding sources, and listing the account's transfers and mass payments.
    The root of the account-to-account money-movement model that all verified Customers and funding sources
    hang from.

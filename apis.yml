aid: dwolla
name: Dwolla
kind: company
description: Dwolla is a Des Moines-based fintech providing an account-to-account (A2A) payments platform
  that lets businesses programmatically move money across the U.S. banking system. Its v2 REST API — a
  JSON-HAL hypermedia API secured with OAuth 2.0 client-credentials — supports ACH (standard and Same-Day),
  instant/real-time payments over the RTP Network and FedNow Service, bank funding sources with micro-deposit
  and Open Banking (Plaid/MX) verification, verified Customers (personal and business with beneficial-owner/KYC
  flows), mass payments, labels and ledgers, virtual account numbers, and webhook event notifications.
  Dwolla ships official SDKs for Node, Python, Ruby, PHP, C#, and Kotlin, low-code Drop-in Components,
  and a read-only MCP server for AI agents.

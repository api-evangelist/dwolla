- aid: dwolla:dwolla-customers-api
  name: Dwolla Customers API
  description: >-
    Create, retrieve, update, list and search Dwolla Customers — the account holders you onboard to send
    or receive money. Supports Unverified, Receive-Only, Personal Verified and Business Verified customer
    types with the identity-verification (KYC/CIP) fields the U.S. banking system requires, plus business
    classification lookups used during business-customer onboarding.

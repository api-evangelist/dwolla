openapi: 3.1.0
info:
  title: Dwolla API - Documents
  description: Dwolla API Documentation
  contact:
    name: Dwolla Developer Relations Team
    url: https://developers.dwolla.com
    email: api@dwolla.com
  version: '2.0'
  termsOfService: https://www.dwolla.com/legal/tos/
  license:
    name: MIT
    url: https://github.com/Dwolla/dwolla-openapi/blob/master/LICENSE
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: https://api.dwolla.com
  description: Production server
- url: https://api-sandbox.dwolla.com
  description: Sandbox server
security:
- clientCredentials: []
tags:
- name: documents
  description: Operations related to Documents
paths:
  /customers/{id}/documents:
    get:
      tags:
      - documents
      summary: List documents for customer
      description: Returns all identity verification documents submitted for a customer. Includes document
        status, verification results, document type (passport, driver's license, etc.), and failure reasons
        if verification was rejected. Used to track document submission and verification progress during
        the business verification process.
      operationId: listCustomerDocuments
      x-speakeasy-group: customers.documents
      x-speakeasy-name-override: list
      x-codeSamples:
      - lang: bash
        source: "GET https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2/documents\n\
          Accept: application/vnd.dwolla.v1.hal+json\nAuthorization: Bearer pBA9fVDBEyYZCEsLfwKehyh1RTpzjUj5KzIRfDi0wKTii7DqY\n\
          \n...\n\n{\n  \"_links\": {\n    \"self\": {\n      \"href\": \"https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2/documents\"\
          \n    }\n  },\n  \"_embedded\": {\n    \"documents\": [\n      {\n        \"_links\": {\n  \
          \        \"self\": {\n            \"href\": \"https://api-sandbox.dwolla.com/documents/56502f7a-fa59-4a2f-8579-0f8bc9d7b9cc\"\
          \n          }\n        },\n        \"id\": \"56502f7a-fa59-4a2f-8579-0f8bc9d7b9cc\",\n     \
          \   \"status\": \"pending\",\n        \"type\": \"passport\",\n        \"created\": \"2015-09-29T21:42:16.000Z\"\
          ,\n        \"documentVerificationStatus\": \"pending\"\n      },\n      {\n        \"_links\"\
          : {\n            \"self\": {\n                \"href\": \"https://api-sandbox.dwolla.com/documents/20988444-c7e1-40cf-ab1a-a20da878e568\"\
          ,\n                \"type\": \"application/vnd.dwolla.v1.hal+json\",\n                \"resource-type\"\
          : \"document\"\n            }\n        },\n        \"id\": \"20988444-c7e1-40cf-ab1a-a20da878e568\"\
          ,\n        \"status\": \"reviewed\",\n        \"type\": \"license\",\n        \"created\": \"\
          2019-05-30T22:01:40.000Z\",\n        \"documentVerificationStatus\": \"rejected\",\n       \
          \ \"failureReason\": \"ScanDobMismatch\",\n        \"allFailureReasons\": [\n            {\n\
          \                \"reason\": \"ScanDobMismatch\",\n                \"description\": \"Scan DOB\
          \ does not match DOB on account\"\n            },\n            {\n                \"reason\"\
          : \"ScanIdExpired\",\n                \"description\": \"ID is expired or missing expiration\
          \ date\"\n            }\n        ]\n      }\n    ]\n  },\n  \"total\": 2\n}\n"
      - lang: javascript
        source: "// Using dwolla-v2 - https://github.com/Dwolla/dwolla-v2-node\nvar customerUrl =\n  \"\
          https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2\";\n\ndwolla\n\
          \  .get(`${customerUrl}/documents`)\n  .then((res) => res.body._embedded[\"documents\"][0].id);\
          \ // => '56502f7a-fa59-4a2f-8579-0f8bc9d7b9cc'\n"
      - lang: python
        source: '# Using dwollav2 - https://github.com/Dwolla/dwolla-v2-python

          customer_url = ''https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2''


          documents = app_token.get(''%s/documents'' % customer_url)

          documents.body[''total''] # => 2

          '
      - lang: php
        source: '<?php

          // Using dwollaswagger - https://github.com/Dwolla/dwolla-swagger-php

          $customerUrl = ''https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2'';


          $customersApi = new DwollaSwagger\CustomersApi($apiClient);


          $customer = $customersApi->getCustomerDocuments($customerUrl);

          $customer->total; # => 2

          ?>

          '
      - lang: ruby
        source: '# Using dwolla_v2 - https://github.com/Dwolla/dwolla-v2-ruby

          customer_url = ''https://api-sandbox.dwolla.com/customers/176878b8-ecdb-469b-a82b-43ba5e8704b2''


          documents = app_token.get "#{customer_url}/documents"

          documents._embedded[''documents''][0].id # => "56502f7a-fa59-4a2f-8579-0f8bc9d7b9cc"

          '
      parameters:
      - name: id
        in: path
        description: customer unique identifier
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: successful operation
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                $ref: '#/components/schemas/Documents'
        '403':
          description: Forbidden
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    post:
      tags:
      - documents
      summary: Create a document for customer
      description: Uploads an identity verification document for a customer using multipart form-data.
        Required when a customer has "document" status during the verification process.
      operationId: createCustomerDocument
      x-speakeasy-group: customers.documents
      x-speakeasy-name-override: create
      x-codeSamples:
      - lang: bash
        source: 'curl -X POST

          \ -H "Authorization: Bearer tJlyMNW6e3QVbzHjeJ9JvAPsRglFjwnba4NdfCzsYJm7XbckcR"

          \ -H "Accept: application/vnd.dwolla.v1.hal+json"

          \ -H "Cache-Control: no-cache"

          \ -H "Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW"

          \ -F "documentType=passport"

          \ -F "file=@foo.png"

          \ ''https://api-sandbox.dwolla.com/customers/1de32eC7-ff0b-4c0c-9f09-19629e6788ce/documents''


          ...


          HTTP/1.1 201 Created

          Location: https://api-sandbox.dwolla.com/documents/11fe0bab-39bd-42ee-bb39-275afcc050d0

          '
      - lang: javascript
        source: "// Using dwolla-v2 - https://github.com/Dwolla/dwolla-v2-node\n// Using form-data - https://github.com/form-data/form-data\
          \ (Not Maintained By Dwolla)\nvar customerUrl = \"https://api-sandbox.dwolla.com/customers/1de32eC7-ff0b-4c0c-9f09-19629e6788ce\"\
          ;\n\nvar requestBody = new FormData();\nrequestBody.append(\"file\", fs.createReadStream(\"\
          mclovin.jpg\"), {\n  filename: \"mclovin.jpg\",\n  contentType: \"image/jpeg\",\n  knownLength:\
          \ fs.statSync(\"mclovin.jpg\").size,\n});\nrequestBody.append(\"documentType\", \"license\"\
          );\n\ndwolla\n  .post(`${customerUrl}/documents`, requestBody)\n  .then((res) => res.headers.get(\"\
          location\")); // => \"https://api-sandbox.dwolla.com/documents/fb919e0b-ffbe-4268-b1e2-947b44328a16\"\
          \n"
      - lang: python
        source: '# Using dwollav2 - https://github.com/Dwolla/dwolla-v2-python

          customer_url = ''https://api-sandbox.dwolla.com/customers/1de32eC7-ff0b-4c0c-9f09-19629e6788ce''


          document = app_token.post(''%s/documents'' % customer_url, file = open(''mclovin.jpg'', ''rb''),
          documentType = ''license'')

          document.headers[''location''] # => ''https://api-sandbox.dwolla.com/documents/fb919e0b-ffbe-4268-b1e2-947b44328a16''

          '
      - lang: php
        source: "/**\n * No example for this language yet.\n **/\n"
      - lang: ruby
        source: '# Using dwolla_v2 - https://github.com/Dwolla/dwolla-v2-ruby

          customer_url = ''https://api-sandbox.dwolla.com/customers/1de32eC7-ff0b-4c0c-9f09-19629e6788ce''


          file = Faraday::UploadIO.new(''mclovin.jpg'', ''image/jpeg'')

          document = app_token.post "#{customer_url}/documents", file: file, documentType: ''license''

          document.response_headers[:location] # => "https://api.dwolla.com/documents/fb919e0b-ffbe-4268-b1e2-947b44328a16"

          '
      parameters:
      - name: id
        in: path
        description: customer unique identifier
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Accept'
      requestBody:
        description: Upload a document for a customer.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - documentType
              - file
              properties:
                documentType:
                  type: string
                  enum:
                  - passport
                  - license
                  - idCard
                  - other
                  example: license
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: successful operation
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MaximumNumberOfResourcesSchema'
                - $ref: '#/components/schemas/InvalidFileTypeSchema'
                - $ref: '#/components/schemas/DuplicateResourceSchema'
        '403':
          description: not found
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/InvalidResourceStateSchema'
                - $ref: '#/components/schemas/NotAuthorizedSchema'
        '404':
          description: not found
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: notFound
                  message:
                    type: string
                    example: Customer not found. Check CustomerId.
        '413':
          description: request entity too large
          headers: {}
          content:
            application/vnd.dwolla.v1.hal+json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: fileTooLarge
                  message:
                    type: string
                    example: Document requests are limited to 10 MiB.
  /beneficial-owners/{id}/documents:
